<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>StrmStation</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ff9d4d'/%3E%3Cstop offset='1' stop-color='%23d9480f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8.5' fill='url(%23g)'/%3E%3Cg stroke='%23fff' stroke-linecap='round' stroke-width='2.2'%3E%3Cpath d='M6.5 11.5h4' opacity='.55'/%3E%3Cpath d='M4.8 16h6.2' opacity='.85'/%3E%3Cpath d='M6.5 20.5h4' opacity='.55'/%3E%3Cpath d='M16 11.5h10' opacity='.75'/%3E%3Cpath d='M16 16h7' opacity='.55'/%3E%3Cpath d='M16 20.5h10' opacity='.35'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // 在首帧之前定主题：等框架挂载再切会闪一下白屏，暗色用户尤其刺眼
      try {
        var m = localStorage.getItem('ui.theme') || 'dark'
        var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.palette = localStorage.getItem('ui.palette') === 'fresh' ? 'fresh' : 'warm'
      } catch (e) {}
    </script>
    <style>
      /* 首屏骨架：页面脚本是一个整包，经隧道下载要一两秒。
         这段时间不要给一块纯色，给个「在加载」的确定感。 */
      html, body { margin: 0; height: 100%; }
      html { background: #f7f5f2; }
      html.dark { background: #101114; }
      #app { min-height: 100%; }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        color: #8b8b8b;
      }
      .boot-logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #ff9d4d, #d9480f);
        box-shadow: 0 8px 24px rgba(217, 72, 15, 0.28);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-bar {
        width: 116px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(128, 128, 128, 0.18);
      }
      .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #ffb066, #d9480f);
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.82; }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-105%); }
        100% { transform: translateX(255%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-bar i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-label="正在加载">
        <div class="boot-logo"></div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
