name: CI

# 只在「验证代码是否可用」时跑，不做镜像构建 —— 镜像由 docker.yml 负责。
# 这样 push 的反馈通常在 1~2 分钟内出来，不用等 Go 镜像层。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        # -race 需要 CGO，ubuntu runner 自带 gcc，这里不用关掉
        run: go test ./... -count=1 -race

      - name: 静态编译（与 Dockerfile 完全一致的参数）
        # 这一步和镜像里的构建串一致，能在 CI 阶段就发现「本地能编、镜像里编不过」的问题
        run: |
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath -ldflags="-s -w" \
            -o /tmp/strm115 ./cmd/server

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 校验 compose 与部署脚本
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml --profile emby --profile auto config > /dev/null
          sh -n docker/entrypoint.sh
          echo "compose / entrypoint 语法 OK"
